name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  cli-smoke:
    name: janus scan code (demo-fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Scan the deliberately vulnerable fixture
        # No optional scanners are installed here, so this exercises the
        # builtin rules only. --fail-on none: the fixture is vulnerable by
        # design; the assertions below are what prove the CLI works.
        run: |
          janus scan code \
            --scope examples/demo-fixture/scope.demo.toml \
            --out "$RUNNER_TEMP/janus-out" \
            --fail-on none
      - name: Assert the outputs exist and contain findings
        run: |
          python - <<'EOF'
          import json, os, pathlib
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "janus-out"
          for name in ("register.json", "findings.json", "findings.sarif", "report.md"):
              assert (out / name).is_file(), f"missing {name}"
          findings = json.loads((out / "findings.json").read_text())
          rows = findings["findings"] if isinstance(findings, dict) else findings
          assert len(rows) > 0, "expected builtin rules to flag the fixture"
          sarif = json.loads((out / "findings.sarif").read_text())
          assert sarif["version"] == "2.1.0"
          print(f"ok: {len(rows)} findings, SARIF 2.1.0")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: janus-demo-scan
          path: ${{ runner.temp }}/janus-out
