[project]
name = "janus-secops"
version = "0.2.0"
description = "Janus: a two-faced, authorization-gated security pipeline (inward source-code scanning + outward authorized external recon) with a local findings dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
janus = "janus.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["janus*"]

[tool.pytest.ini_options]
# Only the project's own tests. Without this, cloning a target repository into
# work/<name>/ makes pytest collect *its* tests (and fail on its dependencies).
testpaths = ["tests"]
norecursedirs = ["work", "demo", "engagements", ".venv", "node_modules", ".cache", ".tools"]

[tool.setuptools]
include-package-data = true
