# Calibration engagement: the local lab target only.
# 127.0.0.1 is refused unless allow_private_targets is set, which is the
# point of that flag: private addresses are a deliberate, local opt-in.

[engagement]
name          = "janus-lab-calibration"
authorized_by = "local operator (own machine)"
reference     = "lab-2026-11-06"
valid_from    = "2026-11-01"
valid_until   = "2030-12-31"
enabled       = true

[targets]
allow = ["127.0.0.1"]
seeds = ["http://127.0.0.1:8099"]
deny  = []
allow_ports = [8099]
forbidden_paths = ["^/admin/(delete|purge|drop)"]

[limits]
allow_active_recon     = true
allow_agent            = true
allow_private_targets  = true
require_nonprod_marker = false
max_rps                = 2
max_requests           = 80

[code]
roots   = []
exclude = []

